<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studown - What's New</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Derived from your Logo Blue */
            --brand-blue: #2563eb; 
            --brand-dark: #1e40af;
            --accent-glow: #60a5fa;
            
            --bg-gradient: linear-gradient(120deg, #f0f4ff 0%, #e0eaff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Background blobs for "Life" */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #bfdbfe; }
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #ddd6fe; }

        /* HERO SECTION */
        header {
            text-align: center;
            padding: 4rem 1.5rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.3);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
            animation: float 6s ease-in-out infinite;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: -webkit-linear-gradient(45deg, var(--brand-blue), var(--brand-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #111;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2);
        }

        .play-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(0,0,0,0.3);
        }

        /* TIMELINE */
        .timeline-container {
            max-width: 700px;
            margin: 3rem auto 6rem;
            padding: 0 1.5rem;
            position: relative;
        }

        .timeline-line {
            position: absolute;
            left: 2rem; /* Mobile alignment */
            top: 20px;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--brand-blue) 0%, rgba(37,99,235,0.1) 100%);
            z-index: 0;
        }

        @media (min-width: 768px) {
            .timeline-line { left: 50%; transform: translateX(-50%); }
        }

        .update-card {
            position: relative;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.6s ease forwards;
        }

        /* Dynamic Delay for animation */
        .update-card:nth-child(1) { animation-delay: 0.1s; }
        .update-card:nth-child(2) { animation-delay: 0.2s; }
        .update-card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card-inner {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            width: 100%;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .card-inner:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Desktop: Alternate sides */
        @media (min-width: 768px) {
            .update-card {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
            }
            
            .card-inner { width: 45%; }
            
            .update-card:nth-child(odd) { justify-content: flex-start; }
            .update-card:nth-child(even) { justify-content: flex-end; }
            
            /* The Center Dot */
            .update-card::after {
                content: '';
                position: absolute;
                left: 50%;
                width: 16px;
                height: 16px;
                background: white;
                border: 4px solid var(--brand-blue);
                border-radius: 50%;
                transform: translateX(-50%);
                z-index: 2;
                box-shadow: 0 0 0 4px rgba(37,99,235,0.2);
            }
        }

        /* Mobile Layout */
        @media (max-width: 767px) {
            .timeline-container { padding-left: 3rem; }
            .timeline-line { left: 1rem; }
            .update-card::before {
                content: '';
                position: absolute;
                left: -2rem;
                top: 24px;
                width: 12px;
                height: 12px;
                background: white;
                border: 3px solid var(--brand-blue);
                border-radius: 50%;
                z-index: 2;
            }
        }

        /* Content Styling */
        .version-tag {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--brand-blue);
            background: rgba(37,99,235,0.1);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .date {
            font-size: 0.85rem;
            color: var(--text-muted);
            float: right;
            margin-top: 4px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0.5rem 0;
            color: var(--text-main);
        }

        .card-desc {
            line-height: 1.6;
            color: #475569;
            margin-bottom: 0;
        }

        /* Badge Styles */
        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .badge.feature { background: #dcfce7; color: #15803d; } /* Green */
        .badge.major { background: #fee2e2; color: #b91c1c; }   /* Red */
        .badge.fix { background: #f1f5f9; color: #64748b; }     /* Grey */

    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header>
        <div class="logo-container">
            <img src="Logo.png" alt="Studown App Icon">
        </div>
        <h1>Studown</h1>
        <p class="subtitle">Your exam countdown companion. Better, faster, and focused.</p>
        
        <a href="https://play.google.com/store/apps/details?id=com.cristimediagroup.studown" target="_blank" class="play-btn">
            <i class="fab fa-google-play"></i> Google Play
        </a>
    </header>

    <div class="timeline-container">
        <div class="timeline-line"></div>
        <div id="changelog-feed">
            <div style="text-align: center; color: #666; padding: 2rem;">Loading updates...</div>
        </div>
    </div>

    <script>
        // Use a relative path to fetch the JSON file
        fetch('updates.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('changelog-feed');
                container.innerHTML = ''; // Clear loading text

                data.forEach(update => {
                    // Determine Badge HTML
                    let badgeHtml = '';
                    if (update.type === 'feature') badgeHtml = '<span class="badge feature">New Feature</span>';
                    else if (update.type === 'major') badgeHtml = '<span class="badge major">Major Update</span>';
                    else if (update.type === 'fix') badgeHtml = '<span class="badge fix">Fix</span>';

                    // Create Card HTML
                    const card = document.createElement('div');
                    card.className = 'update-card';
                    card.innerHTML = `
                        <div class="card-inner">
                            <div>
                                <span class="version-tag">v${update.version}</span>
                                <span class="date">${update.date}</span>
                            </div>
                            <h3 class="card-title">
                                ${update.title} 
                                ${badgeHtml}
                            </h3>
                            <p class="card-desc">${update.description}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Error loading updates:', err);
                document.getElementById('changelog-feed').innerHTML = `
                    <div style="text-align:center; padding: 2rem; background: rgba(255,255,255,0.5); border-radius: 12px;">
                        <h3 style="color: #ef4444;">⚠️ Setup Required</h3>
                        <p>To load the JSON file, this page must be run on a local server (due to browser security).</p>
                        <p style="font-size: 0.9rem; color: #666;">Pro Tip: If you use VS Code, right-click index.html and select <b>"Open with Live Server"</b>.</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
